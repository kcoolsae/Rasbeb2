@import _root_.be.ugent.rasbeb2.db.dto.ClassWithPermissionCount
@import _root_.be.ugent.rasbeb2.db.dto.ClassWithPermissionCount.PermissionCount._

@(cwpc: ClassWithPermissionCount)

<div class="col-4 col-sm-3 col-lg-2">
    @cwpc.permissionCount match{
        case ALL => {
           <span class="fa fa-sm fa-check"></span>
        }
        case EMPTY => {
           <span class="fa fa-sm fa-xmark"></span>
        }
        case NONE => {
            <input type="checkbox" class="me-1" name="checked[]" value="@cwpc.group.id"/>
        }
        case SOME => {
           <span class="fa fa-sm fa-circle-half-stroke"></span>
        }
    }
    @cwpc.group.name
</div>
